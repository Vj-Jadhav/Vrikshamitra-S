<!-- @format -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Eco Beach Cleaner — Environmental Education Game</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      canvas {
        display: block;
        margin: 0 auto;
      }
      /* Add loading style */
      #loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 20px;
        z-index: 1000;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  </head>
  <body>
    <div id="loading">Loading game...</div>
    <script>
      /* ---------- CONFIG ---------- */
      const GAME_WIDTH = 1280;
      const GAME_HEIGHT = 720;

      // Icon sizes
      const UI_ICON_SIZE = 70;
      const BUTTON_ICON_SIZE = 70;

      const ASSETS = {
        bg: {
          game: "./images/beach.jpg",
          recycle: "./images/recycling-bg.webp",
        },
        ui: {
          button: "./images/button.png",
          popup_bg: "./images/popup_bg.png",
          icon_play: "./images/icon_play.png",
          icon_close: "./images/icon_close.png",
          icon_shell: "./images/icon_shell.png",
          icon_home: "./images/icon_home.png",
          icon_music_on: "./images/icon_music_on.png",
          icon_music_off: "./images/icon_music_off.png",
          icon_recycle: "./images/icon_recycle.png",
        },
        machine: {
          base: "./images/machine.png",
          conveyor: "./images/conveyor.png",
        },
        trash: {
          plastic: "./images/plastic-bottle.png",
          metal: "./images/metal-can.png",
          glass: "./images/glass-bottle.png",
          organic: "./images/organic-waste.png",
        },
        bins: {
          plastic: "./images/bin-blue.png",
          metal: "./images/bin-black.png",
          glass: "./images/bin-yellow.png",
          organic: "./images/bin-green.png",
        },
        animals: {
          crab: "./images/crab.png",
          turtle: "./images/turtle.png",
          dolphin: "./images/dolphin.png",
          bird: "./images/bird.png",
        },
        video: { beach: "./images/beach_video.mp4" },
        audio: { bg_music: "./images/bg_music.mp3" },
      };

      /* ---------- ENVIRONMENTAL EDUCATION DATA ---------- */
      const TRASH_TYPES = [
        {
          type: "plastic",
          label: "Plastic",
          binColor: "blue",
          decomposition: "450 years",
          recycledInto: "New bottles, clothing, furniture",
          environmentalTip:
            "Plastic bottles take centuries to decompose and harm marine life.",
        },
        {
          type: "metal",
          label: "Metal",
          binColor: "black",
          decomposition: "200-500 years",
          recycledInto: "New cans, bicycles, cars",
          environmentalTip:
            "Recycling metal saves 95% energy compared to new production.",
        },
        {
          type: "glass",
          label: "Glass",
          binColor: "yellow",
          decomposition: "1 million years",
          recycledInto: "New glass containers, fiberglass",
          environmentalTip:
            "Glass is 100% recyclable and can be reused endlessly without quality loss.",
        },
        {
          type: "organic",
          label: "Organic",
          binColor: "green",
          decomposition: "6 weeks to 12 months",
          recycledInto: "Compost, fertilizer",
          environmentalTip:
            "Organic waste in landfills produces methane, a potent greenhouse gas.",
        },
      ];

      const GameState = {
        level: 1,
        totalScore: 0,
        seeds: parseInt(localStorage.getItem("clean_beach_seeds")) || 10,
        inventory: { plastic: 0, metal: 0, glass: 0, organic: 0 },
        unlockedAnimals:
          JSON.parse(localStorage.getItem("clean_beach_animals")) || [],
        highScore: parseInt(localStorage.getItem("clean_beach_highscore")) || 0,
        musicEnabled: localStorage.getItem("clean_beach_music") !== "false",
        environmentalKnowledge:
          parseInt(localStorage.getItem("clean_beach_knowledge")) || 0,
      };

      /* ---------- UTIL ---------- */
      function clamp(v, a, b) {
        return Math.max(a, Math.min(b, v));
      }
      function randFrom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      /* ---------- ENTITIES ---------- */

      class Garbage extends Phaser.Physics.Matter.Sprite {
        constructor(scene, x, y, trashData) {
          super(scene.matter.world, x, y, "trash_" + trashData.type);
          scene.add.existing(this);

          this.setScale(0.3);
          this.setCircle(30);
          this.setFriction(0.5);
          this.setBounce(0.4);
          this.setDensity(0.005);
          this.setDepth(10);

          if (this.body) this.body.label = "garbage";
          this.trashType = trashData.type;
          this.trashData = trashData;
        }

        safeDestroy() {
          try {
            if (this.body) this.scene.matter.world.remove(this.body);
          } catch (e) {}
          try {
            this.destroy();
          } catch (e) {}
        }
      }

      class Dustbin extends Phaser.GameObjects.Container {
        constructor(scene, x, y, type) {
          super(scene, x, y);
          this.scene = scene;
          scene.add.existing(this);
          this.setDepth(5);

          const key = "bin_" + type;
          const sprite = scene.add.image(0, 0, key).setOrigin(0.5, 0.5);
          sprite.setScale(0.6);
          this.add(sprite);

          this.sensor = scene.matter.add.rectangle(x, y + 15, 90, 30, {
            isStatic: true,
            isSensor: true,
            label: "bin_sensor",
          });

          const wallOpts = {
            isStatic: true,
            label: "bin_wall",
            render: { visible: false },
          };
          this.leftWall = scene.matter.add.rectangle(
            x - 90,
            y,
            10,
            200,
            wallOpts
          );
          this.rightWall = scene.matter.add.rectangle(
            x + 90,
            y,
            10,
            200,
            wallOpts
          );
          this.bottomWall = scene.matter.add.rectangle(
            x,
            y + 90,
            210,
            10,
            wallOpts
          );

          this.moveMode = { horizontal: false, vertical: false };
          this.hSpeed = 0.002;
          this.hAmplitude = 180;
          this.vSpeed = 0.0016;
          this.vAmplitude = 40;
          this.initialX = x;
          this.initialY = y;
          this.y = y;
        }

        setMoving(shouldMove, options = {}) {
          if (!shouldMove) {
            this.moveMode.horizontal = false;
            this.moveMode.vertical = false;
            return;
          }
          this.moveMode.horizontal = true;
          if (options.complex) this.moveMode.vertical = true;
          if (options.hSpeed != null) this.hSpeed = options.hSpeed;
          if (options.hAmplitude != null) this.hAmplitude = options.hAmplitude;
          if (options.vSpeed != null) this.vSpeed = options.vSpeed;
          if (options.vAmplitude != null) this.vAmplitude = options.vAmplitude;
        }

        update(time) {
          let offsetX = 0,
            offsetY = 0;
          if (this.moveMode.horizontal)
            offsetX = Math.sin(time * this.hSpeed) * this.hAmplitude;
          if (this.moveMode.vertical)
            offsetY = Math.sin(time * this.vSpeed) * this.vAmplitude;
          const nx = this.initialX + offsetX;
          const ny = this.initialY + offsetY;
          this.setPosition(nx, ny);
          try {
            this.scene.matter.body.setPosition(this.sensor, {
              x: nx,
              y: ny + 15,
            });
            this.scene.matter.body.setPosition(this.leftWall, {
              x: nx - 90,
              y: ny,
            });
            this.scene.matter.body.setPosition(this.rightWall, {
              x: nx + 90,
              y: ny,
            });
            this.scene.matter.body.setPosition(this.bottomWall, {
              x: nx,
              y: ny + 90,
            });
          } catch (e) {}
        }

        destroy() {
          try {
            this.scene.matter.world.remove(this.sensor);
          } catch (e) {}
          try {
            this.scene.matter.world.remove(this.leftWall);
          } catch (e) {}
          try {
            this.scene.matter.world.remove(this.rightWall);
          } catch (e) {}
          try {
            this.scene.matter.world.remove(this.bottomWall);
          } catch (e) {}
          super.destroy();
        }
      }

      class Animal extends Phaser.GameObjects.Sprite {
        constructor(scene, x, y, key) {
          super(scene, x, y, key);
          scene.add.existing(this);
          this.setDepth(1);
          this.setScale(0.2);
          scene.tweens.add({
            targets: this,
            angle: 5,
            duration: 900,
            yoyo: true,
            repeat: -1,
          });
        }
      }

      /* ---------- SCENES ---------- */

      class BootScene extends Phaser.Scene {
        constructor() {
          super("BootScene");
        }
        preload() {
          this.load.image("bg_game", ASSETS.bg.game);
          this.load.image("bg_recycle", ASSETS.bg.recycle);
          this.load.image("ui_button", ASSETS.ui.button);
          this.load.image("popup_bg", ASSETS.ui.popup_bg);
          this.load.image("icon_play", ASSETS.ui.icon_play);
          this.load.image("icon_close", ASSETS.ui.icon_close);
          this.load.image("icon_shell", ASSETS.ui.icon_shell);
          this.load.image("icon_home", ASSETS.ui.icon_home);
          this.load.image("icon_music_on", ASSETS.ui.icon_music_on);
          this.load.image("icon_music_off", ASSETS.ui.icon_music_off);
          this.load.image("icon_recycle", ASSETS.ui.icon_recycle);

          // Load machine images
          this.load.image("machine", ASSETS.machine.base);
          this.load.image("conveyor", ASSETS.machine.conveyor);

          Object.keys(ASSETS.trash).forEach((k) =>
            this.load.image("trash_" + k, ASSETS.trash[k])
          );
          Object.keys(ASSETS.bins).forEach((k) =>
            this.load.image("bin_" + k, ASSETS.bins[k])
          );
          Object.keys(ASSETS.animals).forEach((k) =>
            this.load.image("animal_" + k, ASSETS.animals[k])
          );

          // Load video with error handling
          this.load.video(
            "beach_video",
            ASSETS.video.beach,
            "loadeddata",
            false,
            true
          );
          this.load.audio("bg_music", ASSETS.audio.bg_music);
        }
        create() {
          // Hide loading indicator
          document.getElementById("loading").style.display = "none";
          this.scene.start("MenuScene");
        }
      }

      class MenuScene extends Phaser.Scene {
        constructor() {
          super("MenuScene");
        }
        create() {
          // Hide loading indicator
          document.getElementById("loading").style.display = "none";

          // First, try to create video background
          let videoBackground;
          try {
            // Check if video is loaded
            if (this.cache.video.has("beach_video")) {
              videoBackground = this.add
                .video(GAME_WIDTH / 2, GAME_HEIGHT / 2, "beach_video")
                .setOrigin(0.5, 0.5)
                .setDepth(-1);

              // Set video properties
              videoBackground.setDisplaySize(GAME_WIDTH, GAME_HEIGHT);
              videoBackground.setLoop(true);
              videoBackground.setMute(true); // Mute to avoid autoplay restrictions

              // Play video
              videoBackground.play();
            } else {
              // If video fails, use image background
              console.log("Video not found, using image background");
              this.add
                .image(GAME_WIDTH / 2, GAME_HEIGHT / 2, "bg_game")
                .setDisplaySize(GAME_WIDTH, GAME_HEIGHT)
                .setDepth(-1);
            }
          } catch (error) {
            console.log("Video error:", error, "Using image background");
            // Fallback to image
            this.add
              .image(GAME_WIDTH / 2, GAME_HEIGHT / 2, "bg_game")
              .setDisplaySize(GAME_WIDTH, GAME_HEIGHT)
              .setDepth(-1);
          }

          this.add
            .text(GAME_WIDTH / 2, 140, "ECO BEACH CLEANER", {
              fontFamily: "Arial",
              fontSize: "72px",
              color: "#fff",
              stroke: "#004d40",
              strokeThickness: 8,
            })
            .setOrigin(0.5);
          this.createButton(GAME_WIDTH / 2, 360, "START CLEANING", () =>
            this.scene.start("GameScene")
          );
          this.createButton(GAME_WIDTH / 2, 460, "RECYCLING FACTORY", () =>
            this.scene.start("RecyclingScene")
          );
          this.add
            .text(GAME_WIDTH / 2, 620, `High Score: ${GameState.highScore}`, {
              fontSize: "26px",
              color: "#000000",
            })
            .setOrigin(0.5);

          // Update seeds display to use icon_shell image with background
          const seedsContainer = this.add.container(GAME_WIDTH - 120, 40);
          const seedsBg = this.add
            .image(0, 0, "ui_button")
            .setDisplaySize(180, 160);
          const seedsText = this.add
            .text(-30, 0, `${GameState.seeds}`, {
              fontSize: "32px",
              color: "#000000",
            })
            .setOrigin(0.5);
          const seedsIcon = this.add
            .image(40, 0, "icon_shell")
            .setDisplaySize(40, 40);
          seedsContainer.add([seedsBg, seedsText, seedsIcon]);

          this.createMusicToggleButton();
        }

        createButton(x, y, text, cb) {
          const container = this.add.container(x, y);
          const bg = this.add
            .image(0, 0, "ui_button")
            .setDisplaySize(360, 160)
            .setInteractive();
          const label = this.add
            .text(0, 0, text, { fontSize: "24px", color: "#000000" })
            .setOrigin(0.5);
          container.add([bg, label]);
          bg.on("pointerdown", () => {
            this.tweens.add({
              targets: container,
              scale: 0.95,
              duration: 120,
              yoyo: true,
              onComplete: cb,
            });
          });
        }

        createMusicToggleButton() {
          const musicIcon = GameState.musicEnabled
            ? "icon_music_on"
            : "icon_music_off";
          // Position music button in top-right corner with proper spacing
          const musicButton = this.add
            .image(GAME_WIDTH - 110, 110, musicIcon)
            .setInteractive()
            .setDisplaySize(UI_ICON_SIZE, UI_ICON_SIZE)
            .setDepth(20);

          musicButton.on("pointerdown", () => {
            GameState.musicEnabled = !GameState.musicEnabled;
            localStorage.setItem("clean_beach_music", GameState.musicEnabled);
            musicButton.setTexture(
              GameState.musicEnabled ? "icon_music_on" : "icon_music_off"
            );
            if (GameState.musicEnabled) {
              this.sound.play("bg_music", { loop: true, volume: 0.5 });
            } else {
              this.sound.stopByKey("bg_music");
            }
          });

          if (GameState.musicEnabled && !this.sound.get("bg_music")) {
            this.sound.play("bg_music", { loop: true, volume: 0.5 });
          }
        }
      }

      class GameScene extends Phaser.Scene {
        constructor() {
          super("GameScene");
        }

        create() {
          this.matter.world.setBounds(0, 0, GAME_WIDTH, GAME_HEIGHT);

          // Try to create video background with fallback
          try {
            if (this.cache.video.has("beach_video")) {
              const video = this.add
                .video(GAME_WIDTH / 2, GAME_HEIGHT / 2, "beach_video")
                .setOrigin(0.5, 0.5)
                .setDepth(-1);

              video.setDisplaySize(GAME_WIDTH, GAME_HEIGHT);
              video.setLoop(true);
              video.setMute(true);
              video.play();
            } else {
              // Fallback to image
              this.add
                .image(GAME_WIDTH / 2, GAME_HEIGHT / 2, "bg_game")
                .setDisplaySize(GAME_WIDTH, GAME_HEIGHT)
                .setDepth(-1);
            }
          } catch (error) {
            // Fallback to image
            this.add
              .image(GAME_WIDTH / 2, GAME_HEIGHT / 2, "bg_game")
              .setDisplaySize(GAME_WIDTH, GAME_HEIGHT)
              .setDepth(-1);
          }

          // Score and level text at top-left with consistent styling
          this.scoreText = this.add
            .text(30, 30, "Score: 0", {
              fontSize: "32px",
              color: "#fff",
              stroke: "#000",
              strokeThickness: 4,
            })
            .setDepth(20);

          this.levelText = this.add
            .text(30, 75, `Level ${GameState.level}`, {
              fontSize: "32px",
              color: "#fff",
              stroke: "#000",
              strokeThickness: 4,
            })
            .setDepth(20);

          // Seeds display with background box at top-right
          this.seedsContainer = this.add.container(GAME_WIDTH - 120, 40);
          const seedsBg = this.add
            .image(0, 0, "ui_button")
            .setDisplaySize(180, 160);
          this.seedsText = this.add
            .text(-30, 0, `${GameState.seeds}`, {
              fontSize: "32px",
              color: "#000000",
            })
            .setOrigin(0.5);
          this.seedsIcon = this.add
            .image(40, 0, "icon_shell")
            .setDisplaySize(40, 40);
          this.seedsContainer.add([seedsBg, this.seedsText, this.seedsIcon]);
          this.seedsContainer.setDepth(20);

          // Create environmental info display at top center
          this.environmentalInfo = this.add
            .text(GAME_WIDTH / 2, 120, "", {
              fontSize: "20px",
              color: "#ffff00",
              backgroundColor: "#000000",
              padding: { x: 10, y: 5 },
              align: "center",
            })
            .setOrigin(0.5)
            .setDepth(30)
            .setAlpha(0);

          // Create vertical button panel with better spacing and center alignment
          this.createButtonPanel();

          this.levelScore = 0;
          this.trashQueue = this.generateLevelTrash(3 + GameState.level);
          this.currentTrashIndex = 0;
          this.isGameActive = true;
          this.trashCollected = false;
          this.successStreak = 0;
          this.difficultyIncreased = false;

          this.slingshotGraphics = this.add.graphics().setDepth(15);
          this.trajectoryGraphics = this.add.graphics().setDepth(15);

          this.isDragging = false;
          this.failTimer = null;

          this.input.on("pointerdown", this.handleInputDown, this);
          this.input.on("pointermove", this.handleInputMove, this);
          this.input.on("pointerup", this.handleInputUp, this);

          this.matter.world.on("collisionstart", (event) => {
            if (!this.isGameActive || this.trashCollected) return;
            event.pairs.forEach((pair) => {
              const a = pair.bodyA,
                b = pair.bodyB;
              if (
                (a.label === "garbage" && b.label === "bin_sensor") ||
                (b.label === "garbage" && a.label === "bin_sensor")
              ) {
                const garbageBody = a.label === "garbage" ? a : b;
                const g = garbageBody.gameObject;
                if (g && g.body && g.body.velocity && g.body.velocity.y > 2) {
                  this.success();
                }
              }
            });
          });

          this.spawnAnimals();
          this.spawnNextTrash();
        }

        createButtonPanel() {
          const buttonStartY = 155; // Increased space below level text
          const buttonSpacing = 80; // More spacing between buttons
          const buttonX = 90; // Center aligned with level text

          // Home button
          this.add
            .image(buttonX, buttonStartY, "icon_home")
            .setInteractive()
            .setDisplaySize(BUTTON_ICON_SIZE, BUTTON_ICON_SIZE)
            .setDepth(20)
            .on("pointerdown", () => {
              this.scene.start("MenuScene");
            });

          // Music toggle button
          const musicIcon = GameState.musicEnabled
            ? "icon_music_on"
            : "icon_music_off";
          const musicButton = this.add
            .image(buttonX, buttonStartY + buttonSpacing, musicIcon)
            .setInteractive()
            .setDisplaySize(BUTTON_ICON_SIZE, BUTTON_ICON_SIZE)
            .setDepth(20);

          musicButton.on("pointerdown", () => {
            GameState.musicEnabled = !GameState.musicEnabled;
            localStorage.setItem("clean_beach_music", GameState.musicEnabled);
            musicButton.setTexture(
              GameState.musicEnabled ? "icon_music_on" : "icon_music_off"
            );
            if (GameState.musicEnabled) {
              this.sound.play("bg_music", { loop: true, volume: 0.5 });
            } else {
              this.sound.stopByKey("bg_music");
            }
          });

          // Recycle machine button
          this.add
            .image(buttonX, buttonStartY + buttonSpacing * 2, "icon_recycle")
            .setInteractive()
            .setDisplaySize(BUTTON_ICON_SIZE, BUTTON_ICON_SIZE)
            .setDepth(20)
            .on("pointerdown", () => {
              this.scene.start("RecyclingScene");
            });

          // Start background music if enabled
          if (GameState.musicEnabled && !this.sound.get("bg_music")) {
            this.sound.play("bg_music", { loop: true, volume: 0.5 });
          }
        }

        generateLevelTrash(count) {
          const out = [];
          for (let i = 0; i < count; i++) out.push(randFrom(TRASH_TYPES));
          return out;
        }

        spawnAnimals() {
          if (GameState.unlockedAnimals.includes("crab"))
            new Animal(this, 150, 650, "animal_crab");
          if (GameState.unlockedAnimals.includes("turtle"))
            new Animal(this, 1100, 680, "animal_turtle");
          if (GameState.unlockedAnimals.includes("bird"))
            new Animal(this, 200, 200, "animal_bird");
          if (GameState.unlockedAnimals.includes("dolphin"))
            new Animal(this, 640, 450, "animal_dolphin");
        }

        spawnNextTrash() {
          if (this.currentTrashIndex >= this.trashQueue.length) {
            this.finishLevel(true);
            return;
          }
          this.trashCollected = false;
          this.isGameActive = true;

          if (this.dustbin) {
            try {
              this.dustbin.destroy();
            } catch (e) {}
            this.dustbin = null;
          }
          if (this.currentGarbage) {
            try {
              this.currentGarbage.safeDestroy();
            } catch (e) {}
            this.currentGarbage = null;
          }

          const trashData = this.trashQueue[this.currentTrashIndex];

          // Show environmental information for this trash type
          this.showEnvironmentalInfo(trashData);

          this.dustbin = new Dustbin(this, 1000, 550, trashData.type);
          if (GameState.level > 2) {
            if (this.difficultyIncreased) {
              this.dustbin.setMoving(true, {
                complex: true,
                hSpeed: 0.0026,
                hAmplitude: 200,
                vSpeed: 0.0018,
                vAmplitude: 50,
              });
            } else {
              this.dustbin.setMoving(true, {
                complex: false,
                hSpeed: 0.002,
                hAmplitude: 180,
              });
            }
          }

          this.currentGarbage = new Garbage(this, 200, 550, trashData);
          this.currentGarbage.setStatic(true);
          this.tweens.add({
            targets: this.currentGarbage,
            scale: { from: 0.1, to: 0.3 },
            duration: 400,
            ease: "Back.out",
          });
        }

        showEnvironmentalInfo(trashData) {
          const infoText = `${
            trashData.label
          } → ${trashData.binColor.toUpperCase()} BIN\nDecomposes in: ${
            trashData.decomposition
          }\nRecycled into: ${trashData.recycledInto}`;

          this.environmentalInfo.setText(infoText);

          // Fade in and out animation
          this.tweens.add({
            targets: this.environmentalInfo,
            alpha: 1,
            duration: 800,
            ease: "Power2",
            onComplete: () => {
              this.time.delayedCall(4000, () => {
                this.tweens.add({
                  targets: this.environmentalInfo,
                  alpha: 0,
                  duration: 800,
                  ease: "Power2",
                });
              });
            },
          });
        }

        handleInputDown(pointer) {
          if (
            !this.isGameActive ||
            !this.currentGarbage ||
            !this.currentGarbage.body
          )
            return;
          const d = Phaser.Math.Distance.Between(
            pointer.x,
            pointer.y,
            this.currentGarbage.x,
            this.currentGarbage.y
          );
          if (d < 150) {
            this.isDragging = true;
            this.dragStart = {
              x: this.currentGarbage.x,
              y: this.currentGarbage.y,
            };
          }
        }

        handleInputMove(pointer) {
          if (!this.isDragging || !this.currentGarbage) return;
          let dx = pointer.x - this.dragStart.x;
          let dy = pointer.y - this.dragStart.y;
          const maxDrag = 200;
          const len = Math.sqrt(dx * dx + dy * dy);
          if (len > maxDrag) {
            const a = Math.atan2(dy, dx);
            dx = Math.cos(a) * maxDrag;
            dy = Math.sin(a) * maxDrag;
          }

          this.slingshotGraphics.clear();
          this.slingshotGraphics.lineStyle(6, 0xffffff, 0.9);
          this.slingshotGraphics.lineBetween(
            this.dragStart.x,
            this.dragStart.y,
            this.dragStart.x + dx,
            this.dragStart.y + dy
          );

          this.currentGarbage.setPosition(
            this.dragStart.x + dx,
            this.dragStart.y + dy
          );
          this.drawTrajectory(
            this.dragStart.x + dx,
            this.dragStart.y + dy,
            dx,
            dy
          );
        }

        drawTrajectory(startX, startY, pullX, pullY) {
          this.trajectoryGraphics.clear();
          this.trajectoryGraphics.fillStyle(0xffffff, 0.7);
          const speedMult = 0.15;
          let vx = -pullX * speedMult;
          let vy = -pullY * speedMult;
          let x = startX,
            y = startY;
          for (let i = 0; i < 30; i++) {
            x += vx;
            y += vy;
            vy += 0.5;
            if (i % 2 === 0) this.trajectoryGraphics.fillCircle(x, y, 5);
          }
        }

        handleInputUp() {
          if (!this.isDragging || !this.currentGarbage) return;
          this.isDragging = false;
          this.slingshotGraphics.clear();
          this.trajectoryGraphics.clear();

          const dx = this.currentGarbage.x - this.dragStart.x;
          const dy = this.currentGarbage.y - this.dragStart.y;

          this.currentGarbage.setStatic(false);
          const speedMult = 0.15;
          this.currentGarbage.setVelocity(-dx * speedMult, -dy * speedMult);
          this.currentGarbage.setAngularVelocity(0.1);

          try {
            if (this.failTimer && this.failTimer.remove)
              this.failTimer.remove(false);
          } catch (e) {}
          this.failTimer = this.time.delayedCall(3000, () => {
            if (
              this.currentGarbage &&
              !this.trashCollected &&
              this.isGameActive
            ) {
              this.fail();
            }
          });
        }

        success() {
          if (this.trashCollected) return;
          this.trashCollected = true;

          try {
            if (this.failTimer && this.failTimer.remove)
              this.failTimer.remove(false);
          } catch (e) {}
          this.failTimer = null;

          const px =
            this.currentGarbage && this.currentGarbage.x
              ? this.currentGarbage.x
              : GAME_WIDTH / 2;
          const py =
            this.currentGarbage && this.currentGarbage.y
              ? this.currentGarbage.y
              : GAME_HEIGHT / 2;
          const popup = this.add
            .text(px, py - 50, "+100", {
              fontSize: "40px",
              color: "#00ff00",
              stroke: "#000",
              strokeThickness: 4,
            })
            .setOrigin(0.5)
            .setDepth(30);
          this.tweens.add({
            targets: popup,
            y: popup.y - 80,
            alpha: 0,
            duration: 900,
            onComplete: () => popup.destroy(),
          });

          this.time.delayedCall(180, () => {
            if (this.currentGarbage) {
              try {
                this.currentGarbage.safeDestroy();
              } catch (e) {}
              this.currentGarbage = null;
            }

            this.levelScore += 100;
            this.scoreText.setText("Score: " + this.levelScore);
            const t = this.trashQueue[this.currentTrashIndex].type;
            GameState.inventory[t] = (GameState.inventory[t] || 0) + 1;

            this.successStreak = (this.successStreak || 0) + 1;
            if (this.successStreak >= 4 && !this.difficultyIncreased) {
              this.difficultyIncreased = true;
              const hint = this.add
                .text(GAME_WIDTH / 2, 120, "Bin is getting trickier!", {
                  fontSize: "28px",
                  color: "#ffcc00",
                  stroke: "#000",
                  strokeThickness: 4,
                })
                .setOrigin(0.5)
                .setDepth(40);
              this.tweens.add({
                targets: hint,
                alpha: 0,
                duration: 2000,
                delay: 1200,
                onComplete: () => hint.destroy(),
              });
            }

            this.currentTrashIndex++;
            this.time.delayedCall(500, () => this.spawnNextTrash());
          });
        }

        fail() {
          try {
            if (this.failTimer && this.failTimer.remove)
              this.failTimer.remove(false);
          } catch (e) {}
          this.failTimer = null;

          this.successStreak = 0;

          if (this.trashCollected) return;
          this.isGameActive = false;

          let px = GAME_WIDTH / 2,
            py = GAME_HEIGHT / 2;
          if (this.currentGarbage && this.currentGarbage.active) {
            px = clamp(this.currentGarbage.x, 50, GAME_WIDTH - 50);
            py = clamp(this.currentGarbage.y, 100, GAME_HEIGHT - 100);
          }

          const miss = this.add
            .text(px, py, "Miss!", {
              fontSize: "40px",
              color: "#ff0000",
              stroke: "#fff",
              strokeThickness: 4,
            })
            .setOrigin(0.5)
            .setDepth(40);
          this.tweens.add({
            targets: miss,
            scale: { from: 0.6, to: 1.6 },
            alpha: 0,
            y: py - 50,
            duration: 800,
            ease: "Back.out",
            onComplete: () => {
              miss.destroy();
              if (this.currentGarbage) {
                try {
                  this.currentGarbage.safeDestroy();
                } catch (e) {}
                this.currentGarbage = null;
              }
              this.showContinuePopup();
            },
          });
        }

        showContinuePopup() {
          const overlay = this.add
            .rectangle(
              GAME_WIDTH / 2,
              GAME_HEIGHT / 2,
              GAME_WIDTH,
              GAME_HEIGHT,
              0x000000,
              0.7
            )
            .setDepth(100)
            .setInteractive();
          const popup = this.add
            .container(GAME_WIDTH / 2, GAME_HEIGHT / 2)
            .setDepth(101);

          const bg = this.add.image(0, 0, "popup_bg");
          if (bg.width < 10) {
            const rect = this.add
              .rectangle(0, 0, 600, 420, 0xffaa00)
              .setStrokeStyle(4, 0xffffff);
            popup.add(rect);
          } else {
            bg.setDisplaySize(600, 420);
            popup.add(bg);
          }

          const title = this.add
            .text(0, -120, "Continue?", {
              fontSize: "60px",
              color: "#fff",
              stroke: "#000",
              strokeThickness: 6,
            })
            .setOrigin(0.5);
          popup.add(title);

          const pCircle = this.add
            .circle(0, 20, 60, 0xff5722)
            .setStrokeStyle(4, 0x000000)
            .setInteractive({ useHandCursor: true });
          const pIcon = this.add
            .image(0, 20, "icon_play")
            .setDisplaySize(UI_ICON_SIZE * 1.5, UI_ICON_SIZE * 1.5);
          popup.add([pCircle, pIcon]);

          const costText = this.add
            .text(0, 110, "2", { fontSize: "40px", color: "#fff" })
            .setOrigin(0.5);
          const costIcon = this.add
            .image(40, 110, "icon_shell")
            .setDisplaySize(UI_ICON_SIZE, UI_ICON_SIZE)
            .setOrigin(0.5);
          popup.add([costText, costIcon]);

          const resumeGame = () => {
            if (GameState.seeds >= 2) {
              GameState.seeds -= 2;
              localStorage.setItem("clean_beach_seeds", GameState.seeds);
              this.seedsText.setText(`${GameState.seeds}`);
              this.tweens.add({
                targets: popup,
                scale: 0.9,
                duration: 120,
                onComplete: () => {
                  overlay.destroy();
                  popup.destroy();
                  this.spawnNextTrash();
                },
              });
            } else {
              this.tweens.add({
                targets: [costText, costIcon],
                scale: 1.4,
                yoyo: true,
                duration: 120,
                repeat: 1,
              });
            }
          };

          pCircle.on("pointerdown", resumeGame);

          const closeBtn = this.add
            .image(270, -170, "icon_close")
            .setDisplaySize(UI_ICON_SIZE * 1.8, UI_ICON_SIZE * 1.8)
            .setInteractive();
          popup.add(closeBtn);
          closeBtn.on("pointerdown", () => {
            overlay.destroy();
            popup.destroy();
            this.finishLevel(false);
          });

          popup.setScale(0);
          this.tweens.add({
            targets: popup,
            scale: 1,
            duration: 300,
            ease: "Back.out",
          });
        }

        finishLevel(completed) {
          const meterScore = this.levelScore;
          const precisionBonus = Math.floor(Math.random() * 20);
          const bagBonus = (GameState.inventory.plastic || 0) * 5;
          const totalLevelScore = meterScore + precisionBonus + bagBonus;

          GameState.totalScore += totalLevelScore;
          if (GameState.totalScore > GameState.highScore) {
            GameState.highScore = GameState.totalScore;
            localStorage.setItem("clean_beach_highscore", GameState.highScore);
          }

          let newAnimal = null;
          if (
            GameState.level === 1 &&
            !GameState.unlockedAnimals.includes("crab")
          ) {
            GameState.unlockedAnimals.push("crab");
            newAnimal = "crab";
          }
          if (
            GameState.level === 3 &&
            !GameState.unlockedAnimals.includes("turtle")
          ) {
            GameState.unlockedAnimals.push("turtle");
            newAnimal = "turtle";
          }

          localStorage.setItem(
            "clean_beach_animals",
            JSON.stringify(GameState.unlockedAnimals)
          );
          GameState.level++;
          localStorage.setItem("clean_beach_seeds", GameState.seeds);

          // After level 3, start showing environmental quiz
          if (GameState.level > 3 && completed) {
            this.scene.start("QuizScene", {
              score: meterScore,
              precision: precisionBonus,
              bag: bagBonus,
              total: totalLevelScore,
              newAnimal: newAnimal,
            });
          } else {
            this.scene.start("RewardScene", {
              score: meterScore,
              precision: precisionBonus,
              bag: bagBonus,
              total: totalLevelScore,
              newAnimal: newAnimal,
            });
          }
        }

        update(time, delta) {
          if (this.dustbin) this.dustbin.update(time);
        }
      }

      class QuizScene extends Phaser.Scene {
        constructor() {
          super("QuizScene");
        }
        init(data) {
          this.data = data;
        }

        create() {
          // Background
          this.cameras.main.setBackgroundColor(0x1a5276);

          // Title
          this.add
            .text(GAME_WIDTH / 2, 80, "ENVIRONMENTAL QUIZ", {

            })
            .setOrigin(0.5);

          // Question
          const question = this.getRandomQuestion();
          this.add
            .text(GAME_WIDTH / 2, 180, question.text, {
              fontSize: "28px",
              color: "#ffffff",
              align: "center",
              wordWrap: { width: GAME_WIDTH - 100 },
            })
            .setOrigin(0.5);

          // Answer options
          const optionYStart = 280;
          const optionSpacing = 80;

          question.options.forEach((option, index) => {
            const optionContainer = this.add.container(
              GAME_WIDTH / 2,
              optionYStart + index * optionSpacing
            );
            const optionBg = this.add
              .rectangle(0, 0, 600, 60, 0x34495e)
              .setStrokeStyle(2, 0x76d7c4)
              .setInteractive({ useHandCursor: true });

            const optionText = this.add
              .text(0, 0, option, {
                fontSize: "22px",
                color: "#ffffff",
              })
              .setOrigin(0.5);

            optionContainer.add([optionBg, optionText]);

            optionBg.on("pointerdown", () => {
              this.checkAnswer(question, index);
            });
          });

          // Skip button
          const skipButton = this.add
            .text(GAME_WIDTH / 2, GAME_HEIGHT - 80, "Skip Quiz", {
              fontSize: "24px",
              color: "#e74c3c",
              backgroundColor: "#2c3e50",
              padding: { x: 20, y: 10 },
            })
            .setOrigin(0.5)
            .setInteractive({ useHandCursor: true });

          skipButton.on("pointerdown", () => {
            this.scene.start("RewardScene", this.data);
          });
        }

        getRandomQuestion() {
          const questions = [
            {
              text: "Which bin should plastic bottles go in?",
              options: ["Blue Bin", "Green Bin", "Black Bin", "Yellow Bin"],
              correct: 0,
            },
            {
              text: "How long does it take for a plastic bottle to decompose?",
              options: ["5 years", "50 years", "450 years", "1000 years"],
              correct: 2,
            },
            {
              text: "What can recycled glass be turned into?",
              options: [
                "New glass containers",
                "Plastic bags",
                "Food waste",
                "Paper products",
              ],
              correct: 0,
            },
            {
              text: "Which material is 100% recyclable without quality loss?",
              options: ["Plastic", "Glass", "Metal", "Organic waste"],
              correct: 1,
            },
            {
              text: "What is the main environmental benefit of recycling metal?",
              options: [
                "Saves 95% energy",
                "Creates new colors",
                "Makes it shiny",
                "Nothing",
              ],
              correct: 0,
            },
            {
              text: "What harmful gas does organic waste produce in landfills?",
              options: ["Oxygen", "Carbon dioxide", "Methane", "Nitrogen"],
              correct: 2,
            },
          ];

          return questions[Math.floor(Math.random() * questions.length)];
        }

        checkAnswer(question, selectedIndex) {
          if (selectedIndex === question.correct) {
            // Correct answer - add bonus and show success
            this.data.total += 50; // Bonus points for correct answer
            GameState.environmentalKnowledge += 10;
            localStorage.setItem(
              "clean_beach_knowledge",
              GameState.environmentalKnowledge
            );

            const correctText = this.add
              .text(GAME_WIDTH / 2, GAME_HEIGHT / 2, "Correct! +50 Points", {
                fontSize: "40px",
                color: "#2ecc71",
              })
              .setOrigin(0.5);

            this.tweens.add({
              targets: correctText,
              scale: 1.2,
              duration: 500,
              yoyo: true,
              onComplete: () => {
                this.time.delayedCall(800, () => {
                  this.scene.start("RewardScene", this.data);
                });
              },
            });
          } else {
            // Wrong answer
            const wrongText = this.add
              .text(GAME_WIDTH / 2, GAME_HEIGHT / 2, "Try again!", {
                fontSize: "40px",
                color: "#e74c3c",
              })
              .setOrigin(0.5);

            this.tweens.add({
              targets: wrongText,
              alpha: 0,
              duration: 1500,
              onComplete: () => {
                wrongText.destroy();
              },
            });
          }
        }
      }

          const elements = ["icon_shell", "trash_plastic", "trash_metal"];
          elements.forEach((element, index) => {
            const x = Phaser.Math.Between(100, GAME_WIDTH - 100);
            const y = GAME_HEIGHT + 50;
            const img = this.add
              .image(x, y, element)
              .setScale(0.1)
              .setAlpha(0.3)
              .setRotation(Phaser.Math.FloatBetween(-0.5, 0.5));

            this.tweens.add({
              targets: img,
              y: -50,
              rotation: img.rotation + Phaser.Math.FloatBetween(-2, 2),
              duration: Phaser.Math.Between(8000, 12000),
              ease: "Linear",
              onComplete: () => {
                img.setPosition(
                  Phaser.Math.Between(100, GAME_WIDTH - 100),
                  GAME_HEIGHT + 50
                );
                img.setRotation(Phaser.Math.FloatBetween(-0.5, 0.5));
              },
              repeat: -1,
            });
          });
        }

        createBreakdownLine(x, y, label, value, color) {
          const elements = [];

          const labelText = this.add
            .text(x, y, label, {
              fontSize: "20px",
              color: "#ffffff",
            })
            .setOrigin(0, 0.5);
          elements.push(labelText);

          const valueText = this.add
            .text(x + 350, y, `${value}`, {
              fontSize: "22px",
              color: color,
              fontStyle: "bold",
            })
            .setOrigin(1, 0.5)
            .setAlpha(0);
          elements.push(valueText);

          return elements;
        }

        createAnimalUnlock(animalType) {
          const animalContainer = this.add.container(GAME_WIDTH / 2, 580);

          // Background
          const unlockBg = this.add
            .rectangle(0, 0, 450, 120, 0x4a148c, 0.8)
            .setStrokeStyle(3, 0xce93d8);
          animalContainer.add(unlockBg);

          // Title
          const unlockTitle = this.add
            .text(0, -35, "NEW ANIMAL UNLOCKED!", {
              fontSize: "22px",
              color: "#e1bee7",
              fontStyle: "bold",
            })
            .setOrigin(0.5);
          animalContainer.add(unlockTitle);

          // Animal image
          const animal = this.add
            .image(-80, 10, "animal_" + animalType)
            .setScale(0.3)
            .setAlpha(0);
          animalContainer.add(animal);

          // Animal name
          const animalName = this.add
            .text(20, 10, this.getAnimalName(animalType), {
              fontSize: "24px",
              color: "#ffffff",
              fontStyle: "bold",
            })
            .setOrigin(0, 0.5)
            .setAlpha(0);
          animalContainer.add(animalName);

          // Celebration particles around animal
          this.time.delayedCall(1200, () => {
            for (let i = 0; i < 12; i++) {
              const angle = (i / 12) * Math.PI * 2;
              const distance = 60;
              const particle = this.add
                .circle(
                  animal.x + Math.cos(angle) * distance,
                  animal.y + Math.sin(angle) * distance,
                  4,
                  0xffff00
                )
                .setAlpha(0);

              animalContainer.add(particle);

              this.tweens.add({
                targets: particle,
                alpha: 1,
                scale: 1.5,
                duration: 300,
                yoyo: true,
                onComplete: () => {
                  particle.destroy();
                },
              });
            }
          });

          // Animation for animal unlock
          this.tweens.add({
            targets: animal,
            alpha: 1,
            scale: 0.35,
            duration: 800,
            ease: "Back.out",
            delay: 1000,
          });

          this.tweens.add({
            targets: animalName,
            alpha: 1,
            duration: 600,
            delay: 1300,
          });

          // Bounce animation for animal
          this.tweens.add({
            targets: animal,
            y: animal.y - 5,
            duration: 800,
            yoyo: true,
            repeat: -1,
            ease: "Sine.inOut",
            delay: 1500,
          });

          return animalContainer;
        }

        getAnimalName(animalType) {
          const names = {
            crab: "Cleaning Crab",
            turtle: "Recycling Turtle",
            bird: "Eco Bird",
            dolphin: "Ocean Dolphin",
          };
          return names[animalType] || animalType;
        }

        createAnimations(title, totalScore, breakdownContainer, continueText) {
          // Sequence of animations
          this.tweens.add({
            targets: title,
            alpha: 1,
            duration: 600,
            ease: "Power2",
          });

          this.time.delayedCall(400, () => {
            this.tweens.add({
              targets: totalScore,
              alpha: 1,
              scale: 1,
              duration: 800,
              ease: "Back.out",
            });

            // Score counting animation
            let currentScore = 0;
            const increment = this.data.total / 60;
            const scoreInterval = this.time.addEvent({
              delay: 20,
              callback: () => {
                currentScore += increment;
                if (currentScore >= this.data.total) {
                  currentScore = this.data.total;
                  scoreInterval.remove();
                }
                totalScore.setText(Math.floor(currentScore));
              },
              repeat: 59,
            });
          });

          this.time.delayedCall(1000, () => {
            this.tweens.add({
              targets: breakdownContainer,
              alpha: { from: 0, to: 1 },
              y: { from: breakdownContainer.y + 50, to: breakdownContainer.y },
              duration: 600,
              ease: "Back.out",
            });

            // Animate score breakdown values
            const valueTexts = breakdownContainer.list.filter(
              (obj) => obj.type === "Text" && obj.alpha === 0
            );
            valueTexts.forEach((text, index) => {
              this.tweens.add({
                targets: text,
                alpha: 1,
                duration: 400,
                delay: 200 + index * 100,
                ease: "Power2",
              });
            });
          });

          this.time.delayedCall(3800, () => {
            this.tweens.add({
              targets: continueText,
              alpha: 1,
              duration: 400,
            });

            // Blinking animation for continue text
            this.tweens.add({
              targets: continueText,
              alpha: 0.5,
              duration: 800,
              yoyo: true,
              repeat: -1,
            });
          });

          // Add some celebratory effects
          this.time.delayedCall(500, () => {
            this.cameras.main.shake(300, 0.005);
            this.cameras.main.flash(300, 255, 255, 255);
          });

          // Additional celebration when seeds appear
          this.time.delayedCall(1700, () => {
            this.cameras.main.shake(200, 0.003);
          });
        }
      }

      class RecyclingScene extends Phaser.Scene {
        constructor() {
          super("RecyclingScene");
        }

        create() {
          // Background - make sure it covers the entire screen
          const bg = this.add.image(
            GAME_WIDTH / 2,
            GAME_HEIGHT / 2,
            "bg_recycle"
          );
          bg.setDisplaySize(GAME_WIDTH, GAME_HEIGHT);

          // Title at top center
          this.add
            .text(GAME_WIDTH / 2, 50, "RECYCLING ZONE", {
              fontSize: "48px",
              color: "#fff",
              stroke: "#000",
              strokeThickness: 6,
            })
            .setOrigin(0.5);

          // Back button at top left
          const backButton = this.add
            .text(40, 40, "BACK", {
              fontSize: "28px",
              color: "#fff",
              backgroundColor: "#000",
              padding: { left: 10, right: 10, top: 5, bottom: 5 },
            })
            .setInteractive({ useHandCursor: true });

          backButton.on("pointerdown", () => {
            this.scene.start("MenuScene");
          });

          // Add animated recycling machine on the right side
          this.createAnimatedMachine();

          // Left side - INVENTORY section
          this.createInventorySection();

          // Right side - Crafting items
          this.createCraftingItems();

          // Bottom center - Machine upgrade section
          this.createMachineUpgradeSection();
        }

        createAnimatedMachine() {
          const machineX = 1050;
          const machineY = 500;

          // Add the conveyor belt (animated)
          const conveyor = this.add
            .image(machineX, machineY + 70, "conveyor")
            .setScale(0.3);

          // Add the machine base on top of the conveyor
          const machineBase = this.add
            .image(machineX + 15, machineY - 135, "machine")
            .setScale(0.9);

          // Animate the conveyor belt (moving texture)
          this.tweens.add({
            targets: conveyor,
            x: conveyor.x + 5, // Small horizontal movement
            duration: 500,
            yoyo: true,
            repeat: -1,
            ease: "Linear",
          });

          // Create some trash items moving on the conveyor
          this.createMovingTrash(machineX, machineY + 40);

          // Add interactive area
          const interactiveArea = this.add
            .rectangle(machineX, machineY, 250, 250, 0x000000, 0)
            .setInteractive({ useHandCursor: true });

          // Add a label under the machine
          this.add
            .text(machineX, machineY + 150, "Recycling Machine", {
              fontSize: "20px",
              color: "#fff",
              backgroundColor: "#000",
              padding: { left: 10, right: 10, top: 5, bottom: 5 },
            })
            .setOrigin(0.5);

          // Pulsing glow effect for the machine
          this.tweens.add({
            targets: machineBase,
            scale: 1,
            duration: 1500,
            yoyo: true,
            repeat: -1,
            ease: "Sine.inOut",
          });

          // Interactive effects
          interactiveArea.on("pointerover", () => {
            machineBase.setTint(0x88ff88);
            conveyor.setTint(0x88ff88);
          });

          interactiveArea.on("pointerout", () => {
            machineBase.clearTint();
            conveyor.clearTint();
          });

          // Show info popup on click
          interactiveArea.on("pointerdown", () => {
            this.showMachineInfo();
          });
        }

        createMovingTrash(machineX, conveyorY) {
          const trashTypes = ["trash_plastic", "trash_metal", "trash_glass"];

          // Create multiple trash items moving along the conveyor
          for (let i = 0; i < 3; i++) {
            const trashType =
              trashTypes[Phaser.Math.Between(0, trashTypes.length - 1)];
            const trash = this.add
              .image(machineX - 100, conveyorY, trashType)
              .setScale(0.05)
              .setAlpha(0);

            // Animate trash moving along conveyor with delay
            this.time.delayedCall(i * 1000, () => {
              trash.setAlpha(1);

              this.tweens.add({
                targets: trash,
                x: machineX + 100,
                duration: 2000,
                ease: "Linear",
                onComplete: () => {
                  // Recycle animation - shrink and disappear
                  this.tweens.add({
                    targets: trash,
                    scale: 0.02,
                    alpha: 0,
                    duration: 500,
                    onComplete: () => {
                      // Reset and restart the animation
                      trash.setPosition(machineX - 100, conveyorY);
                      trash.setScale(0.05);
                      trash.setAlpha(1);

                      // Continue the loop
                      this.tweens.add({
                        targets: trash,
                        x: machineX + 100,
                        duration: 2000,
                        ease: "Linear",
                      });
                    },
                  });
                },
              });
            });
          }
        }

        showMachineInfo() {
          // Create a detailed info popup
          const popupBg = this.add
            .rectangle(500, 300, 320, 180, 0x000000, 0.9)
            .setStrokeStyle(3, 0x4caf50)
            .setDepth(100);

          const infoText = this.add
            .text(
              500,
              280,
              "RECYCLING MACHINE\n\n• Converts trash into useful items\n• Upgrade to process faster\n• Earn seeds from recycling",
              {
                fontSize: "16px",
                color: "#fff",
                align: "center",
                lineSpacing: 8,
              }
            )
            .setOrigin(0.5)
            .setDepth(101);

          // Close button
          const closeButton = this.add
            .rectangle(500, 350, 80, 30, 0x4caf50)
            .setStrokeStyle(2, 0xffffff)
            .setDepth(101)
            .setInteractive({ useHandCursor: true });

          const closeText = this.add
            .text(500, 350, "CLOSE", {
              fontSize: "14px",
              color: "#fff",
            })
            .setOrigin(0.5)
            .setDepth(102);

          // Close functionality
          const closePopup = () => {
            popupBg.destroy();
            infoText.destroy();
            closeButton.destroy();
            closeText.destroy();
          };

          closeButton.on("pointerdown", closePopup);

          // Auto-close after 5 seconds
          this.time.delayedCall(5000, closePopup);
        }

        createInventorySection() {
          // Inventory background - adjusted to make space for machine
          const inventoryBg = this.add.rectangle(
            200,
            360,
            350,
            500,
            0x000000,
            0.7
          );

          // Inventory title
          this.add
            .text(200, 150, "INVENTORY", {
              fontSize: "32px",
              color: "#fff",
            })
            .setOrigin(0.5);

          // Display inventory items
          const trashTypes = [
            { type: "plastic", label: "Plastic" },
            { type: "metal", label: "Metal" },
            { type: "glass", label: "Glass" },
            { type: "organic", label: "Organic" },
          ];

          let y = 220;
          for (const item of trashTypes) {
            // Item icon
            this.add.image(120, y, "trash_" + item.type).setScale(0.08);

            // Item label and count
            this.add
              .text(
                150,
                y,
                `${item.label}: ${GameState.inventory[item.type] || 0}`,
                {
                  fontSize: "24px",
                  color: "#fff",
                }
              )
              .setOrigin(0, 0.5);

            y += 80;
          }
        }

        createCraftingItems() {
          const craftingItems = [
            {
              name: "Recycled Plastic Toy",
              required: { plastic: 8 },
              reward: { seeds: 12 },
              icon: "trash_plastic",
            },
            {
              name: "Metal Art",
              required: { metal: 6 },
              reward: { seeds: 11 },
              icon: "trash_metal",
            },
            {
              name: "Glass Decoration",
              required: { glass: 5 },
              reward: { seeds: 10 },
              icon: "trash_glass",
            },
          ];

          // Adjusted positions to make space for machine
          const startX = 650;
          const startY = 200;
          const spacing = 120;

          craftingItems.forEach((item, index) => {
            const yPos = startY + index * spacing;

            // Item background
            const itemBg = this.add
              .rectangle(startX, yPos, 450, 100, 0x2c3e50, 0.8)
              .setStrokeStyle(2, 0x3498db);

            // Item icon (left side)
            const itemIcon = this.add
              .image(startX - 180, yPos, item.icon)
              .setScale(0.1);

            // Item name
            this.add
              .text(startX - 120, yPos - 25, item.name, {
                fontSize: "20px",
                color: "#ecf0f1",
              })
              .setOrigin(0, 0.5);

            // Required materials
            const materialType = Object.keys(item.required)[0];
            const requiredCount = item.required[materialType];
            const currentCount = GameState.inventory[materialType] || 0;

            this.add
              .text(
                startX - 120,
                yPos + 10,
                `Requires: ${requiredCount} ${
                  materialType.charAt(0).toUpperCase() + materialType.slice(1)
                }`,
                {
                  fontSize: "16px",
                  color: "#bdc3c7",
                }
              )
              .setOrigin(0, 0.5);

            // Current/Max display
            const countText = this.add
              .text(
                startX + 100,
                yPos - 10,
                `${currentCount} / ${requiredCount}`,
                {
                  fontSize: "20px",
                  color: currentCount >= requiredCount ? "#2ecc71" : "#e74c3c",
                }
              )
              .setOrigin(0.5);

            // Reward display (seeds)
            const rewardValue = Object.values(item.reward)[0];
            this.add
              .text(startX + 100, yPos + 15, `${rewardValue}`, {
                fontSize: "18px",
                color: "#f1c40f",
              })
              .setOrigin(0.5);

            // Reward icon (shell)
            const rewardIcon = this.add
              .image(startX + 140, yPos + 15, "icon_shell")
              .setScale(0.3);

            // Craft button
            const craftButton = this.add
              .rectangle(
                startX + 100,
                yPos + 40,
                100,
                30,
                currentCount >= requiredCount ? 0x27ae60 : 0x7f8c8d
              )
              .setStrokeStyle(2, 0xecf0f1)
              .setInteractive({ useHandCursor: true });

            const craftText = this.add
              .text(startX + 100, yPos + 40, "CRAFT", {
                fontSize: "16px",
                color: "#ecf0f1",
              })
              .setOrigin(0.5);

            // Craft button functionality
            craftButton.on("pointerdown", () => {
              if (currentCount >= requiredCount) {
                this.craftItem(item);
              } else {
                // Shake effect when not enough materials
                this.tweens.add({
                  targets: [craftButton, craftText],
                  x: "+=10",
                  yoyo: true,
                  duration: 80,
                  repeat: 2,
                });
              }
            });
          });
        }

        createMachineUpgradeSection() {
          const centerX = GAME_WIDTH / 2;
          const bottomY = GAME_HEIGHT - 100;

          // Machine level background
          const machineBg = this.add
            .rectangle(centerX, bottomY, 300, 120, 0x34495e, 0.9)
            .setStrokeStyle(2, 0x3498db);

          // Machine level text
          this.add
            .text(centerX, bottomY - 40, "Machine Lvl. 1", {
              fontSize: "24px",
              color: "#ecf0f1",
            })
            .setOrigin(0.5);

          // Upgrade cost - CHANGED FROM 500 TO 100
          this.add
            .text(centerX, bottomY - 10, "100", {
              fontSize: "22px",
              color: "#f1c40f",
            })
            .setOrigin(0.5);

          // Upgrade button
          const upgradeButton = this.add
            .rectangle(centerX, bottomY + 25, 150, 40, 0xe67e22)
            .setStrokeStyle(2, 0xecf0f1)
            .setInteractive({ useHandCursor: true });

          const upgradeText = this.add
            .text(centerX, bottomY + 25, "UPGRADE", {
              fontSize: "18px",
              color: "#ecf0f1",
            })
            .setOrigin(0.5);

          // Upgrade button functionality
          upgradeButton.on("pointerdown", () => {
            this.upgradeMachine();
          });
        }

        craftItem(item) {
          const material = Object.keys(item.required)[0];
          const count = item.required[material];
          const reward = Object.values(item.reward)[0];

          // Check if player has enough materials
          if (GameState.inventory[material] >= count) {
            // Deduct materials
            GameState.inventory[material] -= count;

            // Add reward
            GameState.seeds += reward;
            localStorage.setItem("clean_beach_seeds", GameState.seeds);

            // Show congratulations popup
            this.showCraftingSuccess(item, reward);

            // Update the scene to reflect changes
            this.time.delayedCall(2000, () => {
              this.scene.restart();
            });
          }
        }

        showCraftingSuccess(item, reward) {
          // Create popup background
          const popupBg = this.add
            .rectangle(
              GAME_WIDTH / 2,
              GAME_HEIGHT / 2,
              500,
              300,
              0x2c3e50,
              0.95
            )
            .setStrokeStyle(4, 0x3498db)
            .setDepth(100);

          // Congratulations text
          const congratsText = this.add
            .text(GAME_WIDTH / 2, GAME_HEIGHT / 2 - 80, "Congratulations!", {
              fontSize: "32px",
              color: "#2ecc71",
              stroke: "#000",
              strokeThickness: 4,
            })
            .setOrigin(0.5)
            .setDepth(101);

          // Item crafted text
          const itemText = this.add
            .text(
              GAME_WIDTH / 2,
              GAME_HEIGHT / 2 - 30,
              "You've crafted this new item",
              {
                fontSize: "20px",
                color: "#ecf0f1",
              }
            )
            .setOrigin(0.5)
            .setDepth(101);

          // Item icon
          const itemIcon = this.add
            .image(GAME_WIDTH / 2, GAME_HEIGHT / 2 + 20, item.icon)
            .setScale(0.15)
            .setDepth(101);

          // Reward text
          const rewardText = this.add
            .text(
              GAME_WIDTH / 2 - 20,
              GAME_HEIGHT / 2 + 70,
              `You win ${reward}`,
              {
                fontSize: "24px",
                color: "#f1c40f",
              }
            )
            .setOrigin(0.5)
            .setDepth(101);

          // Reward icon
          const rewardIcon = this.add
            .image(GAME_WIDTH / 2 + 40, GAME_HEIGHT / 2 + 70, "icon_shell")
            .setScale(0.4)
            .setDepth(101);

          // Animate popup appearance
          this.tweens.add({
            targets: [
              popupBg,
              congratsText,
              itemText,
              itemIcon,
              rewardText,
              rewardIcon,
            ],
            alpha: { from: 0, to: 1 },
            scale: { from: 0.5, to: 1 },
            duration: 500,
            ease: "Back.out",
          });
        }

        upgradeMachine() {
          // Check if player has enough seeds - CHANGED FROM 500 TO 100
          if (GameState.seeds >= 100) {
            GameState.seeds -= 100; // CHANGED FROM 500 TO 100
            localStorage.setItem("clean_beach_seeds", GameState.seeds);

            // Show upgrade success message
            const upgradeText = this.add
              .text(GAME_WIDTH / 2, GAME_HEIGHT / 2, "Machine Upgraded!", {
                fontSize: "28px",
                color: "#2ecc71",
                backgroundColor: "#000",
                padding: 10,
              })
              .setOrigin(0.5);

            this.tweens.add({
              targets: upgradeText,
              y: upgradeText.y - 50,
              alpha: 0,
              duration: 1500,
              onComplete: () => {
                upgradeText.destroy();
                this.scene.restart();
              },
            });
          } else {
            // Show not enough seeds message
            const errorText = this.add
              .text(GAME_WIDTH / 2, GAME_HEIGHT / 2, "Not enough seeds!", {
                fontSize: "28px",
                color: "#e74c3c",
                backgroundColor: "#000",
                padding: 10,
              })
              .setOrigin(0.5);

            this.tweens.add({
              targets: errorText,
              y: errorText.y - 50,
              alpha: 0,
              duration: 1500,
              onComplete: () => {
                errorText.destroy();
              },
            });
          }
        }
      }

      /* ---------- Game Config ---------- */
      const config = {
        type: Phaser.AUTO,
        width: GAME_WIDTH,
        height: GAME_HEIGHT,
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        physics: {
          default: "matter",
          matter: { debug: false, gravity: { y: 1.2 } },
        },
        scene: [
          BootScene,
          MenuScene,
          GameScene,
          QuizScene,
          RewardScene,
          RecyclingScene,
        ],
      };

      new Phaser.Game(config);
    </script>
  </body>
</html>
